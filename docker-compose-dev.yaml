services:
  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      TZ: "Asia/Seoul"
    env_file:
      - .env.dev
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    env_file:
      - .env.dev
    command: sh -c 'redis-server --requirepass "$$REDIS_PASSWORD"'

  minio:
    image: minio/minio:latest
    ports:
      - "9000:9000"
      - "9001:9001"
    env_file:
      - .env.dev
    command: server /data --console-address ":9001"
    volumes:
      - miniodata:/data

volumes:
  pgdata:
  miniodata:
